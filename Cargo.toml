[workspace]
resolver = "3"
members = ["backend", "frontend", "macros"]

[workspace.package]
version = "0.1.0"
authors = ["Gelaechter"]
description = "A music player"

[workspace.dependencies]
log = "0.4.33"

tokio = { version = "1.50.0", features = ["rt"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
console-subscriber = { version = "0.5.0" }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
thiserror = "2.0.18"
color-eyre = "0.6.5"
reqwest = { version = "0.13.2", features = ["json", "query"] }
uuid = { version = "1.23.0", features = ["v3", "v4"] }

# Optimizes binary size
[profile.size]
inherits = "release"
codegen-units = 1
strip = true
lto = true

# Release performance but with debug symbols
[profile.profiling]
inherits = "release"
debug = true
